syntax = "proto3";
package mprpc;
option go_package = "go-rpc/proto;proto";

message RpcHeader {
    bytes service_name = 1;
    bytes method_name = 2;
    uint32 args_size = 3;
    string trace_id = 4;
    int64 deadline_ms = 5;
    map<string, string> metadata = 6;
    string span_id = 7;         // 本跳 span 的 ID,每次跨进程调用新生成
    string parent_span_id = 8;  // 上游 span 的 ID,用于还原调用树(根 span 为空)
}
